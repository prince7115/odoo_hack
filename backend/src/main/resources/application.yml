# ============================================================
# AssetFlow — Application Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: assetflow-backend

  # ========================
  # Database (PostgreSQL)
  # ========================
  datasource:
    url: jdbc:postgresql://localhost:5432/assetflow_db
    username: postgres
    password: Devankit@925
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # ========================
  # JPA / Hibernate
  # ========================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # ========================
  # Google OAuth2
  # ========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"

# ============================================================
# Custom Application Properties
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:assetflow-super-secret-jwt-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000  # 24 hours
    issuer: assetflow

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

  oauth2:
    redirect-uri: http://localhost:5173/oauth2/callback
    admin-email: ${ADMIN_EMAIL:admin@assetflow.com}

# ============================================================
# SpringDoc / Swagger
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.assetflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
